name: Build FractalAura VST3

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        brew install cmake ninja

    - name: Create build directory
      run: mkdir -p build-${{ matrix.arch }}

    - name: Configure CMake (macOS ${{ matrix.arch }})
      run: |
        cd build-${{ matrix.arch }}
        if [ "${{ matrix.arch }}" == "arm64" ]; then
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
        else
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
        fi

    - name: Build
      run: |
        cd build-${{ matrix.arch }}
        cmake --build . --config Release

    - name: Upload VST3 artifact
      uses: actions/upload-artifact@v4
      with:
        name: FractalAura-VST3-${{ matrix.arch }}
        path: build-${{ matrix.arch }}/FractalAura_artefacts/Release/VST3/
      continue-on-error: true

    - name: Upload AU artifact
      uses: actions/upload-artifact@v4
      with:
        name: FractalAura-AU-${{ matrix.arch }}
        path: build-${{ matrix.arch }}/FractalAura_artefacts/Release/AU/
      continue-on-error: true

  create-release:
    needs: build-macos
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: true
        files: |
          FractalAura-VST3-x86_64/**/*.vst3
          FractalAura-VST3-arm64/**/*.vst3
          FractalAura-AU-x86_64/**/*.component
          FractalAura-AU-arm64/**/*.component
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
